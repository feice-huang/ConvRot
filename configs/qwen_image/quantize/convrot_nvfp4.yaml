# Online convrot config — fed to quantize.py to produce the offline
# quantized transformer. skip_layers (substring match on module FQN):
#   img_in — Linear(64->3072); in_dim 64 not divisible by rot_size 256, must skip
#   time_text_embed — tiny near-input projection, kept bf16 for quality parity
#   proj_out — final N=64 projection, output-sensitive, low gain
#   txt_in — text input projection, input-sensitive, keep bf16
#   norm_out — final AdaLN modulation Linear (norm_out.linear), output-sensitive
#   img_mod / txt_mod — per-block AdaLN modulation Linears (*.img_mod.1 / *.txt_mod.1);
#     they emit scale/shift for the whole block, quant error propagates widely
model:
  type: qwen_image
  path: /path/to/Qwen-Image
inputs:
  prompt: 'A compact green circuit board featuring a Raspberry Pi logo, labeled "Raspberry Pi 4 Model B," with Ethernet, USB, and GPIO connectors, along with various electronic components.'
  height: 1024
  width: 1024
  num_inference_steps: 50
  true_cfg_scale: 4.0
  negative_prompt: ""
weight:
  dtype: convrot_nvfp4
  rot_size: 256
activation:
  per_tensor_scale: true
  use_triton_kernel: true
skip_layers:
  - img_in
  - time_text_embed
  - proj_out
  - txt_in
  - norm_out
  - img_mod
  - txt_mod
